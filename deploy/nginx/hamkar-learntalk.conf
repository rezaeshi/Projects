# همکار من + Learn Talk on app.prodima.ir
# Deployed to /etc/nginx/conf.d/hamkar-learntalk.conf by .github/workflows/deploy-nginx.yml.
# The certificate lives in /etc/letsencrypt/live/app.prodima.ir and certbot renews it automatically.
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name app.prodima.ir _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/app.prodima.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.prodima.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # company site (PHP) at the root: /var/www/prodima
    root /var/www/prodima;
    index index.php;
    location ^~ /inc/ { deny all; }
    location ^~ /assets/ { expires 7d; add_header Cache-Control "public"; }
    rewrite ^/apps/([a-z0-9-]+)/privacy/?$ /privacy.php?slug=$1 last;
    rewrite ^/apps/([a-z0-9-]+)/?$ /app.php?slug=$1 last;
    location ~ ^/(index|app|privacy)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ =404; }

    location = /learntalk/app { return 301 /learntalk/app/; }
    location ^~ /learntalk/app/ {
        alias /opt/learn-talk/web-dist/;
        index index.html;
        try_files $uri $uri/ /learntalk/app/index.html;
        location ~ (index\.html|sw\.js|manifest\.json|version\.json)$ { add_header Cache-Control "no-cache" always; }
    }

    location ^~ /hamkar/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;           # the API trusts only this header, set here
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.prodima.ir _;
    server_tokens off;

    # Released Hamkar app builds call the API over plain HTTP (by IP or domain), and a
    # redirect breaks them (POSTs are not re-sent). Keep serving the API here until every
    # client uses https://app.prodima.ir/hamkar/, then delete this location.
    location ^~ /hamkar/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        return 301 https://app.prodima.ir$request_uri;
    }
}
